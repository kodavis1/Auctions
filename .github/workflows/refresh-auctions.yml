name: Refresh Auction Search

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          HIBID_USERNAME: ${{ secrets.HIBID_USERNAME }}
          HIBID_PASSWORD: ${{ secrets.HIBID_PASSWORD }}
          EBTH_API_TOKEN: ${{ secrets.EBTH_API_TOKEN }}
          EBTH_SESSION_COOKIE: ${{ secrets.EBTH_SESSION_COOKIE }}
          EBTH_USER_ID: ${{ secrets.EBTH_USER_ID }}
        run: python AuctionSearch.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-refresh auction data"
          git push
